[package]
name = "vectorloom-local"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local-only Apple Silicon raster-to-SVG web application"

[features]
default = ["accelerate", "metal"]
accelerate = ["starvector-rs/accelerate"]
metal = ["starvector-rs/metal"]
cuda = ["starvector-rs/cuda"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starvector-rs = { git = "https://github.com/jacksonkasi1/starvector-rs.git", rev = "a637d51", default-features = false }
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vtracer = "1.0.0-alpha.4"
